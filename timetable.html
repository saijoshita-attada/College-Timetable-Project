<!DOCTYPE html>
<html>

<head>
    <title>Timetable</title>
    <style>
        table {
            background-color: orangered;
        }
    </style>
</head>

<body>
    <table border="1">
        <tr>
            <th>period</th>
            <th>1</th>
            <th>2</th>
            <th rowspan="7" style="background-color: blue;color: red;">Lunch</td>
            <th>3</th>
            <th>4</th>
            <th>5</th>
        </tr>
        <tr style="color: green;">
            <td>Time/Day </td>
            <td>10:00 to 11:00</td>
            <td>11:30 to 12:30</td>
            <td>1:30 to 2:30</td>
            <td>3:00 to 4:00</td>
            <td>4:30 to 5:30</td>
        </tr>
        <tr style="color:green ;">
            <td>MON</td>
            <td>FLAT</td>
            <td>SE</td>
            <td colspan="2">CN</td>
            <td>AI&ML</td>
        </tr>
        <tr style="color: gold;">
            <td>TUE</td>
            <td>SE</td>
            <td>CN</td>
            <td>AI&ML</td>
            <td>ACA</td>
            <td>FLAT</td>
        </tr>
        <tr style="color: green;">
            <td>WED</td>
            <td>CN</td>
            <td>ACA</td>
            <td>FLAT</td>
            <td style="text-align: center;" rowspan="3" colspan="2">SE</td>
        </tr>
        <tr style="color: gold;">
            <td>THU</td>
            <td colspan="2">FLAT</td>
            <td>FLAT</td>
        </tr>
        <tr style="color: green;">
            <td>FRI</td>
            <td>AI&ML</td>
            <td>CN</td>
            <td>ACA</td>
        </tr>
        <tr>
            <td style="color: white;">SUN</td>
            <td style="color: yellow;text-align: center;" colspan="6">HOLIDAY</td>
        </tr>
    </table>
</body>

</html>
